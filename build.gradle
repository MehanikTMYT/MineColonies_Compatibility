plugins {
    id 'java-library'
    id 'net.neoforged.gradle.userdev' version '7.1.38'
}

// fleet 26.1.2 port: NeoGradle userdev 7.1.38 + Java 25, local LDT stack and our ports, EMI only (JEI plugin in
// src/disabled). Modules for mods without a 26.1.2 NeoForge release are in src/disabled. Original: .fleet-orig/build.gradle.
java.toolchain.languageVersion = JavaLanguageVersion.of(25)

base {
    archivesName = rootProject.archives_base_name
}
version = "${rootProject.mc_version}-${rootProject.mod_version}"
group = rootProject.maven_group

repositories {
    mavenLocal()
    maven { name "MineColonies"; url "https://ldtteam.jfrog.io/ldtteam/modding" }
}

runs {
    configureEach {
        systemProperty "forge.logging.console.level", "info"
        modSource project.sourceSets.main
    }
    client {
        if (providers.gradleProperty('qaWorld').isPresent()) {
            argument '--quickPlaySingleplayer'
            argument providers.gradleProperty('qaWorld').get()
        }
    }
    server { argument '--nogui' }
}

sourceSets.main.resources { srcDir "src/generated/resources" }

def forks = "$rootDir/../.."
def m2 = "${System.getProperty('user.home')}/.m2/repository"

dependencies {
    implementation "net.neoforged:neoforge:${neoforge_api_version}"

    // Required — our 26.1.2 ports
    implementation files(findProperty("minecoloniesJar") ?: "$forks/MineColonies/build/libs/minecolonies-${minecolonies_version}.jar")
    implementation "com.ldtteam:structurize:${structurize_version}"
    implementation "com.ldtteam:multipiston:${multipiston_version}"
    implementation "com.ldtteam:blockui:${blockui_version}"
    implementation "com.ldtteam:domum-ornamentum:${domumornamentum_version}"
    implementation files("$forks/colonial-addons/MineColonies_Tweaks/build/libs/MineColonies_Tweaks-${mc_version}-${minecolonies_tweaks_version}.jar")

    // Optional modules (compile only; each module loads only when its mod is present)
    compileOnly("dev.emi:emi-neoforge:${emi_version}:api") { transitive = false }
    compileOnly("org.appliedenergistics:appliedenergistics2:${appliedenergistics2_version}") { transitive = false }
    compileOnly files("$m2/com/simibubi/create/create-26.1.2/${create_version}/create-26.1.2-${create_version}.jar",
                      fileTree("$m2/net/createmod") { include "**/*.jar"; exclude "**/*-sources.jar" },
                      fileTree("$m2/dev/engine-room/flywheel/flywheel-neoforge") { include "**/*-api.jar" },
                      fileTree("$m2/com/tterrag/registrate") { include "**/*.jar"; exclude "**/*-sources.jar" })
    compileOnly files("$forks/ae-stack/core/polymorph_plus/neoforge/build/libs/polymorph_plus-neoforge-${polymorph_plus_version}.jar")
    compileOnly files("$forks/pack-libs/curios-neoforge-15.0.0+26.1.2.jar")
    compileOnly fileTree("$forks/pack-libs/compat") { include "*.jar" }
}

tasks.withType(ProcessResources).configureEach {
    var replaceProperties = [mc_version: mc_version,
        mod_id: mod_id, mod_version: mod_version, mod_name: mod_name, mod_description: mod_description, mod_license: mod_license, mod_homepage: mod_homepage, mod_source: mod_source, mod_issues: mod_issues,
        neoforge_api_version: neoforge_api_version, neoforge_api_version_range: neoforge_api_version_range, neoforge_loader_version: neoforge_loader_version,
        minecolonies_version: minecolonies_version, minecolonies_tweaks_version: minecolonies_tweaks_version
    ]
    inputs.properties replaceProperties
    filesMatching(["META-INF/neoforge.mods.toml", "*.json"]) {
        expand replaceProperties + [project: project]
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = "UTF-8"
    options.compilerArgs += ["-Xmaxerrs", "5000"]
}

// Opt-in integration probe, excluded from release builds.
if (providers.gradleProperty('fluidQa').isPresent()) {
    sourceSets { qa { compileClasspath += main.output + main.compileClasspath; runtimeClasspath += main.output + main.runtimeClasspath } }
    def qaJar = tasks.register('fluidQaJar', Jar) {
        archiveClassifier = 'fluid-qa'
        from sourceSets.qa.output
    }
    dependencies { runtimeOnly files(qaJar) }
    dependencies { runtimeOnly("dev.emi:emi-neoforge:${emi_version}") { transitive = false } }
}

// Compile prepared integration sources only against a real FD JAR; never part of the release by default.
if (providers.gradleProperty('fdJar').isPresent()) {
    sourceSets {
        fd {
            java.srcDir 'src/disabled/java'
            java.include '**/farmersdelight/**'
            java.exclude '**/jei/**'
            compileClasspath += main.output + main.compileClasspath
            runtimeClasspath += main.output + main.runtimeClasspath
        }
    }
    dependencies {
        compileOnly files(providers.gradleProperty('fdJar').get())
        fdImplementation files(providers.gradleProperty('fdJar').get())
    }
}

if (providers.gradleProperty('qaRuntimeDir').isPresent()) {
    dependencies { runtimeOnly fileTree(providers.gradleProperty('qaRuntimeDir').get()) { include '*.jar' } }
}
tasks.register('writeQaClasspath') {
    doLast {
        file('qa/logs').mkdirs()
        file('qa/logs/classpath.txt').text = (sourceSets.main.compileClasspath.files + sourceSets.main.runtimeClasspath.files)
            .findAll { it.name.endsWith('.jar') }.collect { it.absolutePath }.unique().join('\n')
    }
}
